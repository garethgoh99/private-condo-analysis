name: URA connectivity check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/ura_token.py"
      - ".github/workflows/ura-connectivity-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Request a URA token (token is never printed)
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: python pipeline/ura_token.py
